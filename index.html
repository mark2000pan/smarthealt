<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile Phone Builder</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>Mobile Phone Builder</h1>
    <div class="grid">
      <section class="card">
        <h2>Choose Components</h2>
        <div id="components" class="components"></div>
        <div style="margin-top:12px">
          <button id="power" class="primary">Power On</button>
        </div>
      </section>
      <section class="card">
        <h2>Set Price</h2>
        <div class="field">
          <label for="price">Price</label>
          <input type="number" id="price" min="0" step="1" placeholder="Enter price">
        </div>
        <h2>Choose Company</h2>
        <div class="field">
          <label for="company">Company</label>
          <select id="company">
            <option value="" selected disabled>Select company</option>
            <option>Apple</option>
            <option>Samsung</option>
            <option>Huawei</option>
            <option>Xiaomi</option>
            <option>Google</option>
            <option>Nokia</option>
            <option>OnePlus</option>
            <option>Sony</option>
            <option>Motorola</option>
            <option>LG</option>
          </select>
        </div>
        <button id="sell" class="primary">Sell Product</button>
      </section>
    </div>
    <section class="card">
      <h2>Power Status</h2>
      <div id="powerStatus" class="summary"></div>
    </section>
    <section class="card">
      <h2>Sale Summary</h2>
      <div id="summary" class="summary"></div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
